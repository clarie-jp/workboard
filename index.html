<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>買取・出品ワークボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>

/* Layout: frosted sticky header + segmented nav, single centered column of quiet white panels, rings carry the progress story */
:root{
  --bg:#f5f5f7; --surface:#ffffff; --surface2:#f0f0f3; --fg:#1d1d1f; --muted:#6e6e73; --faint:#aeaeb2;
  --line:rgba(0,0,0,.08); --accent:#0071e3; --accent-soft:rgba(0,113,227,.10);
  --good:#248a3d; --good-ring:#34c759; --warn:#b25000; --warn-ring:#ff9f0a; --bad:#d70015;
  --track:rgba(0,0,0,.07); --glass:rgba(245,245,247,.78); --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --surface2:#2c2c2e; --fg:#f5f5f7; --muted:#98989d; --faint:#636366;
  --line:rgba(255,255,255,.10); --accent:#0a84ff; --accent-soft:rgba(10,132,255,.18);
  --good:#30d158; --good-ring:#30d158; --warn:#ff9f0a; --warn-ring:#ff9f0a; --bad:#ff453a;
  --track:rgba(255,255,255,.10); --glass:rgba(0,0,0,.72); --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface2:#2c2c2e; --fg:#f5f5f7; --muted:#98989d; --faint:#636366;
  --line:rgba(255,255,255,.10); --accent:#0a84ff; --accent-soft:rgba(10,132,255,.18);
  --good:#30d158; --good-ring:#30d158; --warn:#ff9f0a; --warn-ring:#ff9f0a; --bad:#ff453a;
  --track:rgba(255,255,255,.10); --glass:rgba(0,0,0,.72); --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--glass)}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.brand{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;margin-right:auto}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.04em}
.datebox{display:flex;align-items:center;gap:4px}
.datebox input{border:none;background:var(--surface2);border-radius:10px;padding:6px 10px;font-size:14px}
.iconbtn{border:none;background:transparent;width:32px;height:32px;border-radius:50%;cursor:pointer;color:var(--accent);font-size:18px;line-height:1}
.iconbtn:hover{background:var(--accent-soft)}
.today-btn{border:none;background:transparent;color:var(--accent);cursor:pointer;font-size:14px;padding:4px 6px}

.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:2px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:none;background:transparent;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;color:var(--fg);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.nav{padding-bottom:12px}
.nav .seg{display:flex;width:100%}
.nav .seg button{flex:1;padding:8px 10px}

main{padding-block:24px 64px;display:grid;gap:20px}
h1{font-family:var(--display);font-size:clamp(26px,4vw,34px);font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:15px;font-weight:600;margin:0}
.sub{color:var(--muted);font-size:14px}
.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.06em;font-weight:500}
.titlerow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}

.panel{background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);display:grid;gap:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;cursor:pointer;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.hero{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
@media (max-width:520px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ring{position:relative;width:148px;height:148px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .pct{font-family:var(--display);font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1}
.ring .lbl{font-size:11px;color:var(--muted);margin-top:4px}
.ring.sm{width:72px;height:72px}.ring.sm .pct{font-size:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:16px;min-width:0}
.stat .v{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.stat .k{font-size:12px;color:var(--muted)}

.kpi{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;min-width:0}
.kpi .v{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.2}
.kpi .k{font-size:12px;color:var(--muted)}

.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .5s ease}
.bar.good i{background:var(--good-ring)} .bar.warn i{background:var(--warn-ring)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.on{background:rgba(52,199,89,.15);color:var(--good)}
.pill.done{background:var(--accent-soft);color:var(--accent)}
.pill.u{background:var(--accent-soft);color:var(--accent)}
.pill.m{background:rgba(255,159,10,.16);color:var(--warn)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}

.btn{border:none;border-radius:12px;padding:11px 18px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;font-size:15px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.lg{padding:14px 22px;font-size:16px;border-radius:14px}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.link{border:none;background:none;color:var(--accent);cursor:pointer;padding:4px;font-size:14px}
.link.red{color:var(--bad)}
:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px;box-shadow:0 0 0 2px var(--accent)}

.field{display:grid;gap:6px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.input{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:15px;min-width:0}
.input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;align-items:end}

.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.choice button{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;cursor:pointer;display:grid;gap:2px}
.choice button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.choice b{font-size:15px}.choice span{font-size:12px;color:var(--muted)}
.choice.four{grid-template-columns:repeat(4,1fr)}
@media (max-width:520px){.choice.four{grid-template-columns:repeat(2,1fr)}}
.choice.four button{text-align:center;padding:12px 8px}

.attend{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.attend .times{display:flex;gap:12px;flex-wrap:wrap;flex:1;min-width:0}
.attend .times .field{width:120px}

.list{display:grid}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:none}
.row .grow{flex:1;min-width:0}
.row .amt{font-weight:600}

.appo{border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
.appo-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.appo-head .grow{flex:1;min-width:0;font-weight:600}
.addline{display:grid;grid-template-columns:1fr 1.3fr auto;gap:8px}
@media (max-width:520px){.addline{grid-template-columns:1fr 1fr}.addline .btn{grid-column:1/-1}}

.tbl{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:none}
td .bar{width:90px;display:inline-block;vertical-align:middle;margin-right:8px}
td input.input{padding:6px 8px;width:110px}
td select.input{padding:6px 8px;width:auto}

.empty{text-align:center;padding:32px 16px;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty .big{font-family:var(--display);font-size:19px;font-weight:600;color:var(--fg)}
.notice{background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:500;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pcard{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:grid;gap:10px;min-width:0;border:1px solid transparent}
.pcard.on{border-color:rgba(52,199,89,.35)}
.pcard.none{opacity:.62}
.pcard .top{display:flex;align-items:center;gap:8px}
.pcard .nm{font-weight:700;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .meta{font-size:12px;color:var(--muted)}
.pcard .now{font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.3;overflow-wrap:anywhere}
.pcard .now small{display:block;font-family:var(--font);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.pcard .prog{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:12px;color:var(--muted)}
.pcard .prog .bar{grid-column:1/-1}
.grouphead{display:flex;align-items:baseline;gap:10px;margin-top:4px}
.grouphead .sub{font-size:13px}
.nowchips{display:flex;flex-wrap:wrap;gap:8px}
.nowchips .chip{font-size:13px;padding:6px 12px}
.livedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good-ring);margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.saving{font-size:12px;color:var(--muted)}
.pcard{cursor:pointer;transition:transform .15s ease}
.pcard:hover{transform:translateY(-2px)}
.copyrow{display:flex;gap:8px}
.copyrow .input{flex:1;font-size:13px}
.hero .stats{width:100%}
.grid4.tight{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.qr{width:192px;padding:8px;background:#fff;border-radius:12px}
.qr img,.qr canvas{display:block}
.pill.bad{background:rgba(255,59,48,.14);color:var(--bad)}
.pill.warn{background:rgba(255,159,10,.16);color:var(--warn)}
.remind{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.trow{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.trow:first-child{border-top:none}
.trow .grow{flex:1;min-width:0}
.trow .tt{font-weight:600;overflow-wrap:anywhere}
.trow.done .tt{text-decoration:line-through;color:var(--muted)}
.trow .tn{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.trow .tm{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:6px;font-size:13px}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--faint);background:transparent;cursor:pointer;flex:none;margin-top:1px;display:grid;place-items:center;color:#fff;font-size:14px;line-height:1}
.chk[aria-pressed="true"]{background:var(--good-ring);border-color:var(--good-ring)}
.tsec{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin-top:6px}
.tdue{width:auto;padding:4px 8px;font-size:13px}
.pinwrap{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.pinbox{background:var(--surface);border-radius:24px;padding:24px;width:min(360px,100%);display:grid;gap:16px;justify-items:center;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.pinbox .nm{font-family:var(--display);font-size:24px;font-weight:700}
.dots{display:flex;gap:14px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--faint)}
.dots i.on{background:var(--fg);border-color:var(--fg)}
.pinerr{color:var(--bad);font-size:13px;min-height:18px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.key{height:60px;border:none;border-radius:16px;background:var(--surface2);font-size:24px;font-weight:600;cursor:pointer;color:var(--fg)}
.key.sm{font-size:14px;font-weight:500}
.key:active{background:var(--accent-soft)}
.remember{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.qcard{background:#fff;color:#1d1d1f;border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:10px;justify-items:center;text-align:center;break-inside:avoid}
.qcard .nm{font-family:var(--display);font-size:22px;font-weight:700}
.qcard .rl{font-size:12px;color:#6e6e73}
.qcard .qbox{width:168px;height:168px}
.qcard .qbox img,.qcard .qbox canvas{width:168px!important;height:168px!important}
.qcard .hint{font-size:11px;color:#6e6e73;line-height:1.5}
.cardbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media print{header,.no-print,.toast,.notice{display:none!important}body{background:#fff!important}main{padding:0!important}.cards{grid-template-columns:repeat(2,1fr);gap:12px}.qcard{border:1px dashed #999}}

</style>
</head>
<body>
<header>
  <div class="wrap hbar">
    <div class="brand">買取・出品ワークボード<small id="whoami">BUYER &amp; STAFF</small></div>
    <span class="saving" id="saving" hidden>保存中…</span>
    <div class="datebox">
      <button class="iconbtn" data-act="day" data-d="-1" aria-label="前日">‹</button>
      <input type="date" id="date" aria-label="日付">
      <button class="iconbtn" data-act="day" data-d="1" aria-label="翌日">›</button>
      <button class="today-btn" data-act="today">今日</button>
    </div>
  </div>
  <div class="wrap nav" id="navwrap" hidden>
    <div class="seg" role="tablist" id="nav">
      <button data-act="view" data-v="admin">管理マスター</button>
      <button data-act="view" data-v="peek">スタッフ画面</button>
    </div>
  </div>
</header>
<main class="wrap" id="app">
  <div class="panel"><div class="empty"><div class="big">読み込み中…</div><div>スタッフと記録を取得しています。</div></div></div>
</main>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(() => {
const PER_HOUR = 4;
const TARGET = {unisound: 80000, mansion: 600000};
const TYPE = {unisound: {name: 'UNISOUND', unit: '1件あたり', cls: 'u'}, mansion: {name: 'マンション買取', unit: '1人あたり', cls: 'm'}};
const TASKS = ['出品', '梱包', '発送', '整理'];
const STORES = ['相模原', '新山下'];
const OFFICE_PLACES = ['相模原', '本社', '新山下'];
const ROLE_NAMES = {buyer: '社員（バイヤー）', office: '社員（管理）', part: 'アルバイト'};
const BREAKS = [0, 15, 30, 45, 60, 90, 120];

const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const hmOf = ts => { if (!ts) return ''; const d = new Date(Number(ts)); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const toMin = hm => { if (!hm) return null; const [h, m] = String(hm).split(':').map(Number); return h * 60 + m; };
const yen = n => '¥' + Math.round(Number(n) || 0).toLocaleString('ja-JP');
const fmtH = h => (Math.round(h * 10) / 10).toLocaleString('ja-JP', {maximumFractionDigits: 1}) + 'h';
const rate = (v, t) => t > 0 ? v / t : 0;
const pctTxt = (v, t) => t > 0 ? Math.round(v / t * 100) + '%' : '—';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const dowJ = ds => '日月火水木金土'[new Date(ds + 'T00:00').getDay()];
const month = d => d.slice(0, 7);
const store = {
  get(k, d) { try { const v = localStorage.getItem('wbg_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('wbg_' + k, JSON.stringify(v)); } catch (e) {} }
};

const CARD_ID = (new URLSearchParams(location.search).get('s') || '').slice(0, 64);
const S = {
  isAdmin: false, key: '', url: location.origin + location.pathname, demo: false,
  status: 'loading', card: CARD_ID, staffId: CARD_ID || store.get('me', ''), peek: store.get('peek', ''), cardsFor: '',
  staff: [], att: [], logs: [], appos: [], tasks: [], migrate: false,
  session: false, pin: null, remember: false, lastAct: Date.now(), reminded: '',
  date: todayStr(), view: 'me', adminTab: store.get('adminTab', 'now'),
  draft: {task: '出品', hours: '1', count: '', appoType: 'unisound', appoTitle: '', regName: '', regRole: 'part', regStore: '相模原', regOther: '', addName: '', addRole: 'part', addStore: '相模原', addOther: '', taskTitle: '', taskNote: '', taskDue: todayStr(), taskTime: ''},
  confirm: null, busy: 0, loadedMonth: null
};

let tt; function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2400); }

/* ---------- backend ---------- */
const CFG = window.WB_CONFIG || {};
const params = new URLSearchParams(location.search);
const ZERO = '00000000-0000-0000-0000-000000000000';

function supabaseDb() {
  const c = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
  const chk = r => { if (r.error) throw r.error; return r.data; };
  return {
    async select(t, f) { let q = c.from(t).select('*'); for (const k in f) q = q.eq(k, f[k]); return chk(await q); },
    async insert(t, row) { chk(await c.from(t).insert(row)); },
    async insertIgnore(t, row) { chk(await c.from(t).upsert(row, {onConflict: 'id', ignoreDuplicates: true})); },
    async update(t, id, p) { chk(await c.from(t).update(p).eq('id', id)); },
    async remove(t, id) { chk(await c.from(t).delete().eq('id', id)); },
    subscribe(cb) { const ch = c.channel('workboard'); TABLES.slice(0, 5).forEach(t => ch.on('postgres_changes', {event: '*', schema: 'public', table: t}, cb)); ch.subscribe(); try { c.channel('workboard-tasks').on('postgres_changes', {event: '*', schema: 'public', table: 'tasks'}, cb).subscribe(); } catch (e) {} }
  };
}
function localDb() {
  const get = t => { try { return JSON.parse(localStorage.getItem('wbdemo_' + t) || '[]'); } catch (e) { return []; } };
  const put = (t, v) => { try { localStorage.setItem('wbdemo_' + t, JSON.stringify(v)); } catch (e) {} };
  const cascade = (t, id) => { if (t === 'staff') TABLES.slice(1).forEach(x => put(x, get(x).filter(r => r.staff_id !== id))); if (t === 'appos') put('profits', get('profits').filter(r => r.appo_id !== id)); };
  return {
    async select(t, f) { return get(t).filter(r => Object.keys(f).every(k => r[k] === f[k])); },
    async insert(t, row) { put(t, [...get(t), row]); },
    async insertIgnore(t, row) { const v = get(t); if (!v.some(r => r.id === row.id)) put(t, [...v, row]); },
    async update(t, id, p) { put(t, get(t).map(r => r.id === id ? Object.assign({}, r, p) : r)); },
    async remove(t, id) { put(t, get(t).filter(r => r.id !== id)); cascade(t, id); },
    subscribe(cb) { window.addEventListener('storage', e => { if (e.key && e.key.startsWith('wbdemo_')) cb(); }); }
  };
}

    case 'updateStaff': {

  try {
    const result = write ? await exec(action, args || {}) : null;
    const data = await loadData();
    apply(data); data.result = result || null;

  const sortDue = (a, b) => (a.dueDate + (a.dueTime || '99')).localeCompare(b.dueDate + (b.dueTime || '99')) || a.createdAt - b.createdAt;
  Object.keys(by).forEach(k => by[k].sort(k === 'done' ? (a, b) => b.doneAt - a.doneAt : sortDue));

/* ---------- render ---------- */
function render() {
  document.getElementById('date').value = S.date;
  document.getElementById('navwrap').hidden = !S.isAdmin;
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S.view));
  const me = S.staff.find(s => s.id === S.staffId && s.active !== false);
  document.getElementById('whoami').textContent = S.isAdmin ? '管理者' : me ? me.name + ' さん' : 'BUYER & STAFF';
  const app = document.getElementById('app');
  if (S.status === 'loading') return;
  if (S.status === 'error') { app.innerHTML = `<div class="panel"><div class="empty"><div class="big">読み込めませんでした</div><div>通信を確認して、ページを再読み込みしてください。</div><button class="btn" data-act="retry">再読み込み</button></div></div>`; return; }
  const focus = document.activeElement && document.activeElement.id;
  const vals = {}; app.querySelectorAll('input[id]:not([data-chg]):not([data-draft])').forEach(el => vals[el.id] = el.value);
  const banner = S.demo ? `<div class="notice">デモモードです。記録はこの端末のブラウザにだけ保存されます。</div>` : '';
  if (S.isAdmin) app.innerHTML = banner + (S.view === 'peek' ? viewPeek() : S.view === 'cards' ? viewCards() : viewAdmin());
  else if (S.pin) app.innerHTML = banner + pickView() + pinModal();
  else if (S.card && !me) app.innerHTML = `<div class="panel"><div class="empty"><div class="big">このQRカードは使えません</div><div>登録が削除されたか、利用停止になっています。管理者に確認してください。</div></div></div>`;
  else app.innerHTML = banner + (me ? staffPage(me, false) : pickView());
  for (const id in vals) { const el = document.getElementById(id); if (el && !el.readOnly) el.value = vals[id]; }
  if (focus) { const el = document.getElementById(focus); if (el) el.focus(); }
  if (me && me.role === 'office' && !S.isAdmin && S.reminded !== me.id + S.date) { const T = officeTasks(me.id); S.reminded = me.id + S.date; if (T.by.overdue.length || T.by.today.length) setTimeout(() => toast(`リマインド：期限切れ ${T.by.overdue.length}件・今日まで ${T.by.today.length}件`), 300); }
  if (window.QRCode) app.querySelectorAll('[data-qr]').forEach(el => { try { new QRCode(el, {text: el.dataset.qr, width: 168, height: 168, correctLevel: QRCode.CorrectLevel.M}); } catch (e) {} });
  const qr = document.getElementById('qr');
  if (qr && window.QRCode && S.url) { try { new QRCode(qr, {text: S.url, width: 176, height: 176, correctLevel: QRCode.CorrectLevel.M}); } catch (e) {} }
}

const actorId = () => S.isAdmin ? S.peek : S.staffId;
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act !== 'ask' && !/^(del|off)/.test(act)) S.confirm = null;
  const d = S.date, isToday = d === todayStr();
  switch (act) {
    case 'view': S.view = b.dataset.v; window.scrollTo(0, 0); break;
    case 'day': { const dt = new Date(S.date + 'T00:00'); dt.setDate(dt.getDate() + Number(b.dataset.d)); setDate(ymd(dt)); return; }
    case 'today': setDate(todayStr()); return;
    case 'retry': S.status = 'loading'; render(); reload(); return;
    case 'task': S.draft.task = b.dataset.v; S.draft.count = ''; break;
    case 'appoType': S.draft.appoType = b.dataset.v; break;
    case 'draftSet': S.draft[b.dataset.k] = b.dataset.v; break;
    case 'adminTab': S.adminTab = b.dataset.v; store.set('adminTab', S.adminTab); break;
    case 'ask': S.confirm = b.dataset.k; break;
    case 'pickMe': {
      const st = S.staff.find(x => x.id === id); if (!st) return;
      if (S.migrate) { login(id); return; }
      S.pin = {id, mode: st.pinHash ? 'enter' : 'set1', buf: '', first: '', err: ''}; S.remember = false; break;
    }
    case 'pinCancel': S.pin = null; break;
    case 'pinKey': pinKey(b.dataset.v); return;
    case 'resetPin': S.confirm = null; call('resetPin', {id}, '番号をリセットしました。本人が次に開いたときに新しい番号を決めます'); break;
    case 'setPlace': call('setPlace', {staffId: id, date: d, place: b.dataset.v}, `勤務場所：${b.dataset.v}`); delete S.draft['po_' + id]; return;
    case 'placeOther': S.draft['po_' + id] = ''; render(); document.getElementById('pl-' + id)?.focus(); return;
    case 'dueQuick': S.draft.taskDue = b.dataset.v === 'none' ? '' : addDays(S.date, Number(b.dataset.v)); break;
    case 'addTask': {
      const title = S.draft.taskTitle.trim(); if (!title) { toast('何をするかを入力してください'); document.getElementById('t-title')?.focus(); return; }
      call('addTask', {staffId: id, title, note: S.draft.taskNote, dueDate: S.draft.taskDue, dueTime: S.draft.taskTime}, 'タスクを追加しました');
      S.draft.taskTitle = ''; S.draft.taskNote = ''; S.draft.taskTime = ''; break;
    }
    case 'toggleTask': { const t = S.tasks.find(x => x.id === id); if (!t) return; t.done = !t.done; t.doneAt = t.done ? Date.now() : 0; render(); call('toggleTask', {id, done: t.done}, t.done ? '完了にしました' : '未完了に戻しました'); return; }
    case 'delTask': S.confirm = null; call('delTask', {id}, 'タスクを削除しました'); break;
    case 'switchMe': logout(); return;
    case 'peekPick': S.peek = id; store.set('peek', id); break;
    case 'cards': S.cardsFor = id || ''; S.view = 'cards'; window.scrollTo(0, 0); break;
    case 'cardsBack': S.view = 'admin'; S.adminTab = 'staff'; break;
    case 'print': try { window.print(); } catch (err) {} return;
    case 'openPeek': S.peek = id; store.set('peek', id); S.view = 'peek'; window.scrollTo(0, 0); break;
    case 'copy': {
      const el = document.getElementById(b.dataset.target);
      const fallback = () => { el.focus(); el.select(); toast('選択しました。コピーしてください'); };
      try { navigator.clipboard.writeText(el.value).then(() => toast('コピーしました'), fallback); } catch (err) { fallback(); }
      return;
    }
    case 'register': {
      const name = S.draft.regName.trim(); if (!name) { toast('名前を入力してください'); document.getElementById('r-name')?.focus(); return; }
      const st = draftStore('regStore', 'regOther'); if (S.draft.regRole === 'office' && !st) { toast('拠点名を入力してください'); return; }
      call('register', {name, role: S.draft.regRole, store: st}).then(data => {
        if (data && data.result && data.result.staffId) {
          S.draft.regName = ''; toast(`${name} さん、登録しました`);
          if (S.migrate) login(data.result.staffId); else { S.pin = {id: data.result.staffId, mode: 'set1', buf: '', first: '', err: ''}; S.remember = false; render(); }
        }
      });
      return;
    }
    case 'addStaff': {
      const name = S.draft.addName.trim(); if (!name) { toast('名前を入力してください'); document.getElementById('a-name')?.focus(); return; }
      const st = draftStore('addStore', 'addOther'); if (S.draft.addRole === 'office' && !st) { toast('拠点名を入力してください'); return; }
      call('register', {name, role: S.draft.addRole, store: st}, `${name} さんを追加しました`);
      S.draft.addName = ''; break;
    }
    case 'clockIn': { const t = isToday ? nowHM() : '09:00'; call('clockIn', {staffId: id, date: d, time: t}, `出勤 ${t}`); return; }
    case 'clockOut': { const t = isToday ? nowHM() : '18:00'; call('clockOut', {staffId: id, date: d, time: t}, `退勤 ${t}・お疲れさまでした`).then(() => { if (S.session) setTimeout(logout, 2500); }); return; }
    case 'setNow': {
      const a = attOf(id); if (!a) return;
      const v = b.dataset.v, clear = a.now && a.now.label === v;
      a.now = clear ? null : {label: v, since: nowHM()}; render();
      call('setNow', {staffId: id, date: d, label: clear ? '' : v, since: nowHM()}, clear ? '状況をクリアしました' : `「${v}」にしました`);
      return;
    }
    case 'delAtt': S.confirm = null; call('delAtt', {staffId: id, date: d}, '出勤記録を取り消しました'); break;
    case 'addLog': {
      const hours = Number(S.draft.hours) || 0, count = Math.max(0, Math.round(Number(S.draft.count) || 0));
      call('addLog', {staffId: id, date: d, task: S.draft.task, hours, count}, `${S.draft.task} ${hours}時間を記録しました`);
      S.draft.count = ''; break;
    }
    case 'delLog': S.confirm = null; call('delLog', {id}, '削除しました'); break;
    case 'addAppo': call('addAppo', {staffId: id, date: d, type: S.draft.appoType, title: S.draft.appoTitle.trim()}, `${TYPE[S.draft.appoType].name} のアポを追加しました`); S.draft.appoTitle = ''; break;
    case 'addProfit': {
      const amtEl = document.getElementById('pa-' + id), noteEl = document.getElementById('pn-' + id);
      const raw = (amtEl.value || '').trim();
      if (raw === '' || isNaN(Number(raw))) { toast('粗利の金額を入力してください'); amtEl.focus(); return; }
      const amount = Math.round(Number(raw));
      call('addProfit', {appoId: id, amount, note: noteEl.value.trim(), at: isToday ? nowHM() : ''}, `粗利 ${yen(amount)} を入力しました`);
      amtEl.value = ''; noteEl.value = ''; return;
    }
    case 'delProfit': S.confirm = null; call('delProfit', {id}, '削除しました'); break;
    case 'delAppo': S.confirm = null; call('delAppo', {id}, 'アポを削除しました'); break;
    case 'offStaff': S.confirm = null; call('updateStaff', {id, active: false}, '利用停止にしました'); break;
    case 'onStaff': call('updateStaff', {id, active: true}, '利用を再開しました'); break;
    case 'delStaff': S.confirm = null; call('deleteStaff', {id}, '削除しました'); if (S.peek === id) { S.peek = ''; store.set('peek', ''); } break;
  }
  render();
});
document.addEventListener('keydown', e => {
  if (S.pin && !e.target.closest('input[type=text]')) {
    if (/^[0-9]$/.test(e.key)) { e.preventDefault(); pinKey(e.key); return; }
    if (e.key === 'Backspace') { e.preventDefault(); pinKey('back'); return; }
    if (e.key === 'Escape') { S.pin = null; render(); return; }
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('pcard')) { e.preventDefault(); e.target.click(); return; }
  if (e.key !== 'Enter' || !e.target.id) return;
  const m = e.target.id.match(/^p[an]-(.+)$/); if (m) { e.preventDefault(); document.querySelector(`[data-act="addProfit"][data-id="${m[1]}"]`)?.click(); }
  if (e.target.id === 'r-name') { e.preventDefault(); document.querySelector('[data-act="register"]')?.click(); }
  if (e.target.id === 'a-name') { e.preventDefault(); document.querySelector('[data-act="addStaff"]')?.click(); }
});
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.draft; if (k) S.draft[k] = e.target.value; });
document.addEventListener('change', e => {
  const el = e.target, k = el.dataset && el.dataset.draft;
  if (k) { S.draft[k] = el.value; if (k === 'hours') render(); return; }
  if (el.id === 'date') { if (el.value) setDate(el.value); return; }
  const c = el.dataset && el.dataset.chg; if (!c) return;
  const id = el.dataset.id;
  if (c === 'att') {
    const f = el.dataset.f;
    if (f === 'in' && !el.value) { toast('出勤時刻は空にできません'); render(); return; }
    call('setAtt', {staffId: id, date: S.date, field: f, value: f === 'breakMin' ? Number(el.value) : el.value}, '勤怠を更新しました');
  } else if (c === 'staffRole') {
    const s = S.staff.find(x => x.id === id);
    call('updateStaff', {id, role: el.value, store: el.value === 'part' ? (STORES.includes(s && s.store) ? s.store : '相模原') : el.value === 'office' ? ((s && s.store) || '本社') : ''}, '区分を変更しました');
  } else if (c === 'placeText') {
    if (el.value.trim()) call('setPlace', {staffId: id, date: S.date, place: el.value.trim()}, `勤務場所：${el.value.trim()}`);
  } else if (c === 'taskDue') {
    call('taskDue', {id, dueDate: el.value}, '期限を変更しました');
  } else if (c === 'staffStore') {
    call('updateStaff', {id, store: el.value}, '店舗を変更しました');
  }
});
function login(id) {
  S.staffId = id; S.pin = null; S.session = !S.remember;
  store.set('me', S.remember ? id : '');
  S.lastAct = Date.now(); window.scrollTo(0, 0); reload();
}
function logout() {
  S.staffId = ''; S.session = false; S.pin = null; store.set('me', '');
  window.scrollTo(0, 0); reload();
}
async function pinKey(v) {
  const P = S.pin; if (!P) return;
  P.err = '';
  if (v === 'back') { P.buf = P.buf.slice(0, -1); render(); return; }
  if (P.buf.length >= 4) return;
  P.buf += v; render();
  if (P.buf.length < 4) return;
  const st = S.staff.find(x => x.id === P.id); if (!st) { S.pin = null; render(); return; }
  const rem = document.getElementById('pin-remember'); S.remember = !!(rem && rem.checked);
  if (P.mode === 'enter') {
    if (await sha256(P.id + ':' + P.buf) === st.pinHash) login(P.id);
    else { P.buf = ''; P.err = '番号が違います。もう一度入力してください'; render(); }
  } else if (P.mode === 'set1') { P.first = P.buf; P.buf = ''; P.mode = 'set2'; render(); }
  else {
    if (P.buf !== P.first) { P.buf = ''; P.first = ''; P.mode = 'set1'; P.err = '番号が一致しませんでした。最初から決めてください'; render(); return; }
    const pin = P.buf; const id = P.id;
    const ok = await call('setPin', {id, pin}, '暗証番号を設定しました');
    if (ok) login(id); else { P.buf = ''; render(); }
  }
}
function setDate(dt) {
  const changed = month(dt) !== S.loadedMonth;
  S.date = dt; S.confirm = null; render();
  if (changed) reload();
}

/* ---------- start ---------- */
let rt;
(async () => {
  S.demo = !(CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase);
  db = S.demo ? localDb() : supabaseDb();
  const given = params.get('admin') || '';
  if (given && ((S.demo && given === 'demo') || (CFG.adminKeyHash && await sha256(given) === CFG.adminKeyHash))) { S.isAdmin = true; S.key = given; S.view = 'admin'; }
  render();
  await reload();
  db.subscribe(() => { clearTimeout(rt); rt = setTimeout(() => { if (!S.busy) reload(); }, 400); });
  ['click', 'keydown', 'input', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { S.lastAct = Date.now(); }, {passive: true}));
  setInterval(() => { if (S.session && S.staffId && Date.now() - S.lastAct > 5 * 60000) { logout(); toast('しばらく操作がなかったので、名前の選択に戻りました'); } }, 20000);
  setInterval(() => { if (S.status === 'ready' && !S.busy && !document.hidden && !(document.activeElement && document.activeElement.matches('input,select'))) reload(); }, 60000);
})();
})();
</script>
